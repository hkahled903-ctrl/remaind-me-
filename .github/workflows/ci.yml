name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the timezone database
        run: pip install tzdata pyyaml

      - name: Run the scenario and pipeline tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test the real entry point
        env:
          TELEGRAM_BOT_TOKEN: "ci-placeholder-not-a-real-token"
        run: python -m reminder --dry-run

      - name: Confirm the package imports without side effects
        run: python -c "import reminder, reminder.cli, reminder.commands, reminder.config, reminder.logs, reminder.policy, reminder.state, reminder.transport; print('imports ok')"
