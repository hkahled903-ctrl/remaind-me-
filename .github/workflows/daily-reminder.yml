name: Daily report reminder

on:
  schedule:
    # UTC, not local time. Egypt has been UTC+2 year-round since 2023, so this is
    # 09:00 Cairo. Keep this in step with reminder_time in config.json -- the
    # suite fails the build if they disagree (tests/test_pipeline.py).
    - cron: "0 7 * * *"
  workflow_dispatch: # run it by hand from this page at any time

# Least privilege: this job only needs to read the repository to check it out.
permissions:
  contents: read

# Never run two reminders at once, but do not cancel one that is mid-send.
concurrency:
  group: daily-report-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    # A reminder that hangs must not hold a runner. The HTTP timeout is 20s.
    timeout-minutes: 5

    steps:
      # Pinned to commit SHAs, not tags: a tag like @v4 can be moved to new code.
      # Dependabot keeps these current; see README "Updating the pinned actions".
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Belt and braces: ubuntu ships tzdata, but zoneinfo silently falls back to
      # UTC without it and the reminder would fire at the wrong hour.
      - name: Install the timezone database
        run: pip install tzdata

      # The token now arrives from Infisical at run time, so the credential that
      # must exist in GitHub is the machine identity, not the bot token itself.
      # Name it here, so a missing identity fails with an instruction instead of
      # an action error.
      - name: Fail fast if the Infisical identity is missing
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::the Infisical machine identity is not set in this repository"
            echo "Add INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Secrets are fetched from Infisical, not read from GitHub Secrets: a
      # rotated bot token or a new Upstash database takes effect on the next run
      # with nothing committed here. The identity is scoped to this one project
      # and one environment, so it cannot read anything else.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "universal-auth"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          # The whole dev environment is injected, including
          # UPSTASH_REDIS_REST_URL / _TOKEN, which the runner needs to find the
          # chat connected through the Connect page. Without them it falls back
          # to a local binding.json it writes and throws away.
          env-slug: "dev"

      # Every value in the dev environment is now in this job's environment, so
      # the command reads exactly what it always did.
      - name: Send the reminder
        run: python -m reminder --scheduled
