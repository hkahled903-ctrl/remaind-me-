name: Interval reminder

on:
  schedule:
    # A heartbeat, not the schedule itself. GitHub will not run a cron finer than
    # every five minutes, and even that is only a *request*: scheduled workflows
    # are queued and commonly start several minutes late, so "every 30 minutes"
    # is approximate. The code in reminder/commands.py::cmd_interval decides
    # whether this particular beat belongs to a period that has not been served.
    #
    # Cost: this fires about 288 times a day. Each run is a few seconds. If that
    # matters, widen the interval and the smallest offered reminder with it.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Beats must not pile up, but a beat already mid-send must be allowed to finish.
concurrency:
  group: interval-report-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the timezone database
        run: pip install tzdata

      - name: Fail fast if the bot token is missing
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not set in this repository"
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Without these two the runner keeps no memory of what it already sent, so
      # every heartbeat would look like a fresh period and the reminder would
      # repeat all day. Set both, or the heartbeat is not safe to run.
      - name: Run one heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python -m reminder --interval