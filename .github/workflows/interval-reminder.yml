name: Interval reminder

on:
  schedule:
    # A heartbeat, not the schedule itself. GitHub will not run a cron finer than
    # every five minutes, and even that is only a *request*: scheduled workflows
    # are queued and commonly start several minutes late, so "every 30 minutes"
    # is approximate. The code in reminder/commands.py::cmd_interval decides
    # whether this particular beat belongs to a period that has not been served.
    #
    # Cost: this fires about 288 times a day. Each run is a few seconds. If that
    # matters, widen the interval and the smallest offered reminder with it.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Beats must not pile up, but a beat already mid-send must be allowed to finish.
concurrency:
  group: interval-report-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the timezone database
        run: pip install tzdata

      # The token now arrives from Infisical at run time, so the credential that
      # must exist in GitHub is the machine identity, not the bot token itself.
      - name: Fail fast if the Infisical identity is missing
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::the Infisical machine identity is not set in this repository"
            echo "Add INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Without UPSTASH_REDIS_REST_URL and _TOKEN the runner keeps no memory of
      # what it already sent, so every heartbeat would look like a fresh period
      # and the reminder would repeat all day. Both now come from Infisical, and
      # the identity is scoped to this project and one environment.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          # The action spells this one "universal". "universal-auth" is
          # rejected with "Invalid authentication method".
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          # The whole dev environment is injected, so the durable store
          # arrives with everything else.
          env-slug: "dev"

      - name: Run one heartbeat
        run: python -m reminder --interval