name: Register Telegram webhook (one-off)

on:
  workflow_dispatch: # manual only; never scheduled

permissions:
  contents: read

concurrency:
  group: register-webhook
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Injects the whole dev environment, including TELEGRAM_BOT_TOKEN and
      # WEBHOOK_SECRET. Nothing is echoed; GitHub masks the token in logs.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "dev"

      # This harmless update has no message/chat, so it cannot bind or change
      # timer state. A 200 proves Vercel received the exact secret and header.
      - name: Verify Vercel accepts the Infisical webhook secret
        run: |
          python -c "
          import os
          import urllib.error
          import urllib.request
          request = urllib.request.Request(
              'https://remaind-me-xi.vercel.app/telegram/webhook',
              data=b'{}',
              headers={
                  'Content-Type': 'application/json',
                  'X-Telegram-Bot-Api-Secret-Token': os.environ['WEBHOOK_SECRET'].strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f'Vercel webhook secret check failed with HTTP {response.status}')
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'Vercel webhook secret check failed with HTTP {exc.code}; secret was not logged') from None
          print('Vercel webhook secret check: HTTP 200; secret was not logged')"

      # Reuses the app's own register_webhook -- the same call --serve makes.
      # It sends message and callback_query updates and prints only the URL.
      - name: Register the webhook
        run: |
          python -c "
          import os
          from reminder.transport import Telegram
          from reminder.webapp import register_webhook
          register_webhook('https://remaind-me-xi.vercel.app', os.environ['WEBHOOK_SECRET'], Telegram(os.environ['TELEGRAM_BOT_TOKEN']))"

      # Confirm in the same run. getWebhookInfo never returns secret_token.
      - name: Confirm
        run: |
          python -c "
          import os
          from reminder.transport import Telegram
          client = Telegram(os.environ['TELEGRAM_BOT_TOKEN'])
          me = client.call('getMe', {}).get('result', {})
          r = client.call('getWebhookInfo', {}).get('result', {})
          allowed = r.get('allowed_updates')
          last_error = r.get('last_error_message')
          print('bot username   :', me.get('username'))
          print('url            :', r.get('url') or '(NOT REGISTERED)')
          print('allowed_updates:', allowed)
          print('pending updates:', r.get('pending_update_count'))
          print('last_error_date:', r.get('last_error_date'))
          print('last_error     :', last_error)
          if allowed != ['message', 'callback_query']:
              raise SystemExit('Telegram did not register the required allowed_updates')
          if last_error is not None:
              raise SystemExit('Telegram reports a webhook delivery error')"