name: Reminder nudge

on:
  schedule:
    # Five minutes is the finest schedule GitHub accepts. `reminder --nudge`
    # decides whether a particular beat needs to ask again; most beats send
    # nothing at all, which is what makes a stopped timer genuinely silent.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A nudge that is already in flight must finish, and a stale one must not stack
# behind it -- two nudges at once is the one thing this feature must not do.
concurrency:
  group: reminder-nudge
  cancel-in-progress: true

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e1fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      # Secrets come from Infisical at run time instead of from GitHub Secrets,
      # so a rotated token takes effect on the next beat with nothing committed.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          # The action spells this one "universal". "universal-auth" is
          # rejected with "Invalid authentication method".
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "dev"

      - name: Ask again if the last reminder went unanswered
        run: python -m reminder --nudge